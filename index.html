<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>২৯ কার্ড — অনলাইন</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--f1:#2e8b57;--f2:#1b5e3a;--gold:#f5c542;--panel:#0a4a2e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#0b3d26;color:#fff;min-height:100vh;padding:10px}
.hidden{display:none!important}
.box{background:var(--panel);border-radius:12px;padding:10px;margin:8px auto;max-width:600px}
input{padding:10px;border-radius:8px;border:none;font-size:16px;width:100%;margin:4px 0}
button{padding:9px 13px;border:none;border-radius:8px;background:var(--gold);color:#222;font-size:15px;font-weight:600;cursor:pointer;margin:3px}
button:disabled{background:#555;color:#999;cursor:not-allowed}
button.alt{background:#3498db;color:#fff}
.small{font-size:12px;opacity:.85}
.score{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:14px}
.score b{color:var(--gold)}
.wl{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700}
.wl.win{background:#2ecc71;color:#063}
.wl.lose{background:#e74c3c;color:#fff}
.table{position:relative;width:100%;max-width:600px;height:340px;margin:8px auto;border-radius:50%/42%;background:radial-gradient(ellipse at center,var(--f1),var(--f2));border:10px solid #7a4a1d;box-shadow:inset 0 0 30px #0008,0 4px 12px #0006}
.seat{position:absolute;width:118px;text-align:center;background:#063620dd;border-radius:10px;padding:5px;font-size:13px;transition:box-shadow .3s}
.seat.turn{box-shadow:0 0 0 3px var(--gold)}
.seat.win{box-shadow:0 0 0 3px #7CFC00}
.s1{left:2px;top:50%;transform:translateY(-50%)}
.s2{top:2px;left:50%;transform:translateX(-50%)}
.s3{right:2px;top:50%;transform:translateY(-50%)}
.form{display:flex;gap:2px;justify-content:center;margin-top:3px}
.form span{width:16px;height:16px;border-radius:3px;font-size:10px;line-height:16px;font-weight:700}
.form .W{background:#2ecc71;color:#063}
.form .L{background:#e74c3c;color:#fff}
.coins{color:var(--gold);font-weight:700;font-size:12px}
.dbl{color:#ff8a65;font-weight:700;font-size:12px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#0007;border-radius:12px;padding:6px 10px;min-width:120px}
.trumpS{font-size:34px;line-height:1}
.pot{color:var(--gold);font-weight:700}
.pc{position:absolute;width:50px;height:72px;background:#fff;color:#222;border-radius:7px;font-weight:700;text-align:center;font-size:15px;box-shadow:0 2px 6px #0008;transition:all .35s;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .35s}
.pc.red{color:#c0392b}
.pc small{font-size:10px}
.pc .pts{position:absolute;top:-6px;right:-6px;font-size:10px;background:var(--gold);color:#222;border-radius:6px;padding:0 4px}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.pc0{bottom:12px;left:50%;transform:translateX(-50%)}
.pc1{left:58px;top:50%;transform:translateY(-50%)}
.pc2{top:12px;left:50%;transform:translateX(-50%)}
.pc3{right:58px;top:50%;transform:translateY(-50%)}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.card{position:relative;width:54px;height:78px;background:#fff;color:#222;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;border:2px solid transparent;padding:0;margin:0}
.card.red{color:#c0392b}
.card small{font-size:12px}
.card.ok{border-color:var(--gold);cursor:pointer}
.card.back{background:#1e4fa8;color:#fff;font-size:22px}
.card:disabled{opacity:.45;cursor:not-allowed}
.card .pts{position:absolute;top:2px;left:3px;font-size:10px;color:#222;background:var(--gold);border-radius:6px;padding:0 3px}
.hist{font-size:12px;opacity:.9;line-height:1.6}
.status{font-size:15px;margin-top:4px}
</style>
</head>
<body>

<div id="lobby" class="box">
  <h2>২৯ কার্ড — অনলাইন</h2>
  <input id="name" placeholder="আপনার নাম">
  <input id="stake" placeholder="প্রতি রাউন্ডের বাজি (কয়েন), ডিফল্ট ১০" inputmode="numeric">
  <button onclick="createRoom(false)">বন্ধুর সাথে খেলা (নতুন রুম)</button>
  <button class="alt" onclick="createRoom(true)">প্র্যাকটিস (বটের সাথে)</button>
  <hr>
  <input id="code" placeholder="রুম কোড (৪ সংখ্যা)" inputmode="numeric">
  <button onclick="joinRoom($('code').value.trim())">রুমে যোগ দিন</button>
  <p id="lobbyMsg" class="small"></p>
</div>

<div id="game" class="hidden">
  <div id="info" class="box"></div>
  <div id="table"></div>
  <div id="actions" class="box"></div>
  <div id="history" class="box"></div>
  <div id="hand"></div>
</div>

<script>
/* ============ 1. Firebase config ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAYoI07W5ZrdJJElN4GHJFQbmXmqhBZCS0",
  authDomain: "card-45327.firebaseapp.com",
  databaseURL: "https://card-45327-default-rtdb.firebaseio.com",
  projectId: "card-45327",
  storageBucket: "card-45327.firebasestorage.app",
  messagingSenderId: "904448516419",
  appId: "1:904448516419:web:2230ecf3124697f4648ff6",
  measurementId: "G-BP3V1NJ3CD"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const auth = firebase.auth();

/* ============ 2. Constants ============ */
const SUITS = ['♠','♥','♦','♣'];
const RANKS = ['7','8','9','10','J','Q','K','A'];
const PTS   = {J:3, '9':2, A:1, '10':1};
const TORD  = {J:8, '9':7, A:6, '10':5, K:4, Q:3, '8':2, '7':1};
const PORD  = {A:8, '10':7, K:6, Q:5, J:4, '9':3, '8':2, '7':1};
const START_COINS = 1000;

/* ============ 3. State & helpers ============ */
let uid = null, code = null, mySeat = -1, S = null, hand = [], viewHand = [];
let botHandsCache = {}, botListen = false, botTimer = null, busy = false, nextQueued = false;
let showCards = true;   // শুধু আপনার স্ক্রিনে তাস দেখানো/লুকানো (অন্যদের দেখা যায় না)

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cnt  = o => Object.keys(o || {}).length;
const vals = o => Object.values(o || {});
const nameOf = i => (S && S.seats && S.seats[i]) ? S.seats[i].name : 'খালি';
const isBot = i => !!(S && S.seats && S.seats[i] && S.seats[i].bot);
const isRed = s => s === '♥' || s === '♦';
const msg = t => { $('lobbyMsg').textContent = t; };
const stakeOf = s => (s && s.stake) || 10;
const oppSeats = bt => [0,1,2,3].filter(i => i % 2 !== bt);

function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function legalIn(c, hd, table, lead){
  const n = cnt(table);
  if (n === 0 || n === 4) return true;
  return c.s === lead || !hd.some(x => x.s === lead);
}

function winnerOf(cards, trump, lead){
  const hasT = cards.some(x => x.c.s === trump);
  let best = null, bv = -1;
  for (const x of cards) {
    let v = 0;
    if (hasT) { if (x.c.s === trump) v = TORD[x.c.r]; }
    else if (x.c.s === lead) v = PORD[x.c.r];
    if (v > bv) { bv = v; best = x; }
  }
  return best;
}

/* ============ 4. Auth ============ */
auth.onAuthStateChanged(u => {
  if (u) {
    uid = u.uid;
    const saved = JSON.parse(localStorage.getItem('c29') || 'null');
    if (saved && !code) joinRoom(saved.code, true);
  } else {
    auth.signInAnonymously();
  }
});

/* ============ 5. Room ============ */
async function createRoom(practice){
  const name = $('name').value.trim() || 'খেলোয়াড়';
  const stake = Math.max(1, parseInt($('stake').value, 10) || 10);
  let c;
  do { c = String(1000 + Math.floor(Math.random()*9000)); }
  while ((await db.ref('rooms/'+c).once('value')).exists());
  await db.ref('rooms/'+c).set({
    host: uid, phase: 'lobby', dealer: 0, stake,
    seats: {0: {uid, name}},
    scores: [0,0], teamPts: [0,0], history: null,
    coins: {0: START_COINS, 1: START_COINS, 2: START_COINS, 3: START_COINS},
    form: {0: '', 1: '', 2: '', 3: ''}
  });
  await joinRoom(c);
  if (practice) await startGame();
  else msg('রুম কোড: ' + c + ' (বন্ধুকে এই কোড দিন)');
}

async function joinRoom(c, silent){
  if (code) return;
  const name = $('name').value.trim() || 'খেলোয়াড়';
  const ref = db.ref('rooms/'+c);
  const snap = await ref.once('value');
  if (!snap.exists()) {
    if (!silent) msg('রুম পাওয়া যায়নি');
    localStorage.removeItem('c29');
    return;
  }
  let seat = -1;
  const seats = snap.val().seats || {};
  for (let i=0;i<4;i++) if (seats[i] && seats[i].uid === uid) seat = i;
  if (seat < 0) {
    const r = await ref.child('seats').transaction(ss => {
      ss = ss || {};
      for (let i=0;i<4;i++) if (!ss[i]) { ss[i] = {uid, name}; return ss; }
      return;
    });
    if (!r.committed) { msg('রুম ভর্তি'); return; }
    const ns = r.snapshot.val() || {};
    seat = [0,1,2,3].find(i => ns[i] && ns[i].uid === uid);
  }
  if (seat === undefined || seat < 0) { msg('সিট পাওয়া যায়নি'); return; }

  code = c; mySeat = seat;
  localStorage.setItem('c29', JSON.stringify({code: c}));
  $('lobby').classList.add('hidden');
  $('game').classList.remove('hidden');
  listen();
}

function listen(){
  db.ref('rooms/'+code).on('value', x => {
    S = x.val();
    if (S && S.host === uid && !botListen) {
      botListen = true;
      db.ref('botHands/'+code).on('value', y => { botHandsCache = y.val() || {}; });
    }
    render();
  });
  db.ref('hands/'+code+'/'+mySeat).on('value', x => { hand = vals(x.val()); render(); });
  if (!botTimer) botTimer = setInterval(botTick, 900);
}

/* ============ 6. Start & deal ============ */
async function startGame(){
  await db.ref('rooms/'+code+'/seats').transaction(ss => {
    ss = ss || {};
    for (let i=0;i<4;i++) if (!ss[i]) ss[i] = {uid: 'bot'+i, name: 'বট '+(i+1), bot: true};
    return ss;
  });
  const snap = (await db.ref('rooms/'+code).once('value')).val();
  if (snap.phase !== 'lobby') return;
  await deal(snap.dealer || 0, snap.seats);
}

async function deal(dealer, seats){
  const deck = [];
  for (const s of SUITS) for (const r of RANKS) deck.push({s, r});
  shuffle(deck);
  const humans = {}, bots = {};
  for (let i=0;i<4;i++){
    const h = deck.slice(i*8, i*8+8);
    if (seats && seats[i] && seats[i].bot) bots[i] = h; else humans[i] = h;
  }
  await db.ref('hands/'+code).set(humans);
  await db.ref('botHands/'+code).set(cnt(bots) ? bots : null);
  botHandsCache = bots;
  await db.ref('rooms/'+code).update({
    phase: 'bidding', dealer, bidTurn: (dealer+1)%4,
    bids: null, highBid: 15, highBidder: -1,
    trump: null, table: null, leadSuit: null, turn: null, lastWinner: null,
    tricks: 0, teamPts: [0,0], roundMsg: null,
    doubles: null, mult: 1, seatPts: {0:0,1:0,2:0,3:0}
  });
}

const nextRound = () => deal((S.dealer + 1) % 4, S.seats);

/* ============ 7. Bidding (প্রতি সিট একবার) ============ */
async function bidAs(seat, v){                 // v = 0 মানে পাস
  await db.ref('rooms/'+code).transaction(s => {
    if (!s || s.phase !== 'bidding' || s.bidTurn !== seat) return;
    s.bids = s.bids || {};
    if (s.bids[seat] !== undefined) return;
    s.bids[seat] = v;
    if (v > s.highBid) { s.highBid = v; s.highBidder = seat; }
    if (cnt(s.bids) >= 4) {
      if (s.highBidder < 0) s.phase = 'redeal';
      else { s.phase = 'trump'; s.turn = s.highBidder; }
      s.bidTurn = null;
    } else {
      s.bidTurn = (seat+1) % 4;
    }
    return s;
  });
}
const bid = v => bidAs(mySeat, v);

async function chooseTrumpAs(seat, suit){
  await db.ref('rooms/'+code).transaction(s => {
    if (!s || s.phase !== 'trump' || s.highBidder !== seat) return;
    s.trump = suit; s.phase = 'double'; s.turn = null;
    s.doubles = {};
    s.tricks = 0; s.teamPts = [0,0];
    return s;
  });
}
const chooseTrump = suit => chooseTrumpAs(mySeat, suit);

/* ============ 7b. Double (বিপক্ষ দল) ============ */
async function doubleAs(seat, yes){
  await db.ref('rooms/'+code).transaction(s => {
    if (!s || s.phase !== 'double') return;
    const bt = s.highBidder % 2;
    if (seat % 2 === bt) return;                       // শুধু বিপক্ষ দল
    s.doubles = s.doubles || {};
    if (s.doubles[seat] !== undefined) return;
    s.doubles[seat] = yes ? 1 : 0;
    const opps = oppSeats(bt);
    if (opps.every(i => s.doubles[i] !== undefined)) {
      s.mult = opps.some(i => s.doubles[i] === 1) ? 2 : 1;
      s.phase = 'playing';
      s.turn = s.highBidder;
    }
    return s;
  });
}
const doubleMe = yes => doubleAs(mySeat, yes);

/* ============ 8. Play ============ */
function finishRound(s){
  const bt = s.highBidder % 2;
  const pts = s.teamPts[bt];
  const won = pts >= s.highBid;
  const wt = won ? bt : 1-bt;
  const stake = stakeOf(s) * (s.mult || 1);

  s.scores = s.scores || [0,0];
  s.scores[wt] += 1;

  s.form = s.form || {};
  s.coins = s.coins || {};
  for (let i=0;i<4;i++) {
    const win = (i % 2) === wt;
    s.form[i] = ((s.form[i] || '') + (win ? 'W' : 'L')).slice(-5);
    const cur = (s.coins[i] ?? START_COINS);
    s.coins[i] = Math.max(0, cur + (win ? stake : -stake));
  }

  s.phase = 'roundOver';
  const dbl = (s.mult || 1) === 2 ? ' (ডাবল)' : '';
  s.roundMsg = `দল ${bt+1} ডেকেছিল ${s.highBid}, পেয়েছে ${pts}${dbl}। ${won ? 'ডাকা দল জিতেছে' : 'বিপক্ষ দল জিতেছে'}।`;
  s.history = (vals(s.history)).concat([s.roundMsg]).slice(-6);
}

async function playAs(seat, card){
  const r = await db.ref('rooms/'+code).transaction(s => {
    if (!s || s.phase !== 'playing' || s.turn !== seat) return;
    if (cnt(s.table) >= 4) { s.table = null; s.leadSuit = null; s.lastWinner = null; }
    s.table = s.table || {};
    if (cnt(s.table) === 0) s.leadSuit = card.s;
    s.table[seat] = card;
    if (cnt(s.table) === 4) {
      const cards = Object.entries(s.table).map(([k,c]) => ({seat: +k, c}));
      const w = winnerOf(cards, s.trump, s.leadSuit);
      const pts = cards.reduce((a,x) => a + (PTS[x.c.r] || 0), 0);
      s.teamPts[w.seat % 2] += pts;
      s.seatPts = s.seatPts || {};
      s.seatPts[w.seat] = (s.seatPts[w.seat] || 0) + pts;
      s.tricks += 1;
      s.turn = w.seat;
      s.lastWinner = w.seat;
      if (s.tricks === 8) {
        s.teamPts[w.seat % 2] += 1;     // শেষ ট্রিকের বোনাস
        finishRound(s);
      }
    } else {
      s.turn = (seat+1) % 4;
    }
    return s;
  });
  return r.committed;
}

async function removeCard(seat, card, handArr){
  const nh = handArr.filter(c => !(c.s === card.s && c.r === card.r));
  if (isBot(seat)) {
    botHandsCache[seat] = nh;
    await db.ref('botHands/'+code+'/'+seat).set(nh.length ? nh : null);
  } else {
    await db.ref('hands/'+code+'/'+seat).set(nh.length ? nh : null);
  }
}

async function playIdx(i){ await play(viewHand[i]); }

async function play(card){
  if (!S || !card) return;
  if (S.phase !== 'playing' || S.turn !== mySeat || !legalIn(card, hand, S.table, S.leadSuit)) return;
  if (await playAs(mySeat, card)) await removeCard(mySeat, card, hand);
}

/* ============ 9. Bot (হোস্টের ব্রাউজার চালায়) ============ */
function evalHand(h){
  let best = {v:0, s:SUITS[0]};
  for (const s of SUITS) {
    let v = 0;
    for (const c of h) {
      if (c.s === s) v += (PTS[c.r]||0) + (c.r==='J'?1:0) + (c.r==='9'?1:0);
      else v += (PTS[c.r]||0) * 0.25;
    }
    v += Math.max(0, h.filter(c => c.s === s).length - 3);
    if (v > best.v) best = {v, s};
  }
  return best;
}

async function botBid(seat){
  const h = vals(botHandsCache[seat]);
  const {v} = evalHand(h);
  const want = Math.max(16, S.highBid + 1);
  await bidAs(seat, (want <= 28 && Math.round(v) >= want + 1) ? want : 0);
}

async function botTrump(seat){
  const h = vals(botHandsCache[seat]);
  await chooseTrumpAs(seat, evalHand(h).s);
}

async function botDouble(seat){
  const h = vals(botHandsCache[seat]);
  const {v} = evalHand(h);
  const yes = v >= 9 && Math.random() < 0.5;
  await doubleAs(seat, yes);
}

function rk(c){
  if (c.s === S.trump) return 100 + TORD[c.r];
  if (c.s === S.leadSuit) return 50 + PORD[c.r];
  return PORD[c.r];
}

function botPick(seat, h){
  const legal = h.filter(c => legalIn(c, h, S.table, S.leadSuit));
  if (!legal.length) return null;
  const tbl = Object.entries(S.table || {}).map(([k,c]) => ({seat:+k, c}));
  if (tbl.length === 0) {
    const nt = legal.filter(c => c.s !== S.trump);
    return (nt.length ? nt : legal).slice().sort((a,b) => rk(b) - rk(a))[0];
  }
  const cur = winnerOf(tbl, S.trump, S.leadSuit);
  const partnerWinning = (cur.seat % 2) === (seat % 2);
  const winning = legal.filter(c => winnerOf(tbl.concat([{seat, c}]), S.trump, S.leadSuit).seat === seat);
  if (partnerWinning) return legal.slice().sort((a,b) => (PTS[b.r]||0) - (PTS[a.r]||0) || rk(a) - rk(b))[0];
  if (winning.length) return winning.slice().sort((a,b) => rk(a) - rk(b))[0];
  return legal.slice().sort((a,b) => (PTS[a.r]||0) - (PTS[b.r]||0) || rk(a) - rk(b))[0];
}

async function botPlay(seat){
  const h = vals(botHandsCache[seat]);
  if (!h.length) return;
  const card = botPick(seat, h);
  if (!card) return;
  if (await playAs(seat, card)) await removeCard(seat, card, h);
}

async function botTick(){
  if (!S || S.host !== uid) return;
  // রাউন্ড শেষ হলে ৫ সেকেন্ড পর নিজে থেকেই নতুন রাউন্ড
  if ((S.phase === 'roundOver' || S.phase === 'redeal') && !nextQueued) {
    nextQueued = true;
    setTimeout(() => {
      nextQueued = false;
      if (S && S.host === uid && (S.phase === 'roundOver' || S.phase === 'redeal')) nextRound();
    }, 5000);
  }
  if (busy || S.phase === 'lobby') return;
  let job = null;
  if (S.phase === 'bidding' && S.bidTurn != null && isBot(S.bidTurn)) job = () => botBid(S.bidTurn);
  else if (S.phase === 'trump' && isBot(S.highBidder)) job = () => botTrump(S.highBidder);
  else if (S.phase === 'double') {
    const bt = S.highBidder % 2;
    const pending = oppSeats(bt).find(i => isBot(i) && !(S.doubles && S.doubles[i] !== undefined));
    if (pending !== undefined) job = () => botDouble(pending);
  }
  else if (S.phase === 'playing' && isBot(S.turn)) job = () => botPlay(S.turn);
  if (!job) return;
  busy = true;
  try { await job(); } finally { busy = false; }
}

/* ============ 10. Render ============ */
function bidText(i){
  const b = S.bids && S.bids[i];
  if (b === undefined) return 'অপেক্ষায়';
  return b === 0 ? 'পাস' : `বিড ${b}`;
}

function formHTML(i){
  const f = (S.form && S.form[i]) || '';
  if (!f) return '';
  return `<div class="form">${f.split('').map(c => `<span class="${c}">${c==='W'?'জ':'হ'}</span>`).join('')}</div>`;
}

function coinsOf(i){
  return (S.coins && S.coins[i] != null) ? S.coins[i] : START_COINS;
}

function statusText(){
  const ph = S.phase;
  if (ph === 'lobby') return `সিট ${cnt(S.seats)}/৪। হোস্ট খেলা শুরু করলে খালি সিটে বট বসবে`;
  if (ph === 'bidding') {
    const high = S.highBid > 15 ? `সর্বোচ্চ বিড ${S.highBid} (${esc(nameOf(S.highBidder))})` : 'এখনও কেউ বিড করেনি';
    return (S.bidTurn === mySeat ? 'আপনার বিডের পালা' : `${esc(nameOf(S.bidTurn))}-এর বিড`) + ' · ' + high;
  }
  if (ph === 'trump') return S.highBidder === mySeat ? 'আপনি বিড জিতেছেন, তুরুপ বেছে নিন' : `${esc(nameOf(S.highBidder))} তুরুপ বাছছে`;
  if (ph === 'double') {
    const bt = S.highBidder % 2;
    if (bt === mySeat % 2) return 'বিপক্ষ দল ডাবল করবে কিনা ঠিক করছে';
    return 'ডাবল করবেন কিনা ঠিক করুন';
  }
  if (ph === 'playing') return S.turn === mySeat ? 'আপনার চাল' : `${esc(nameOf(S.turn))}-এর চাল`;
  if (ph === 'redeal') return 'কেউ বিড করেনি, ৫ সেকেন্ডে নতুন বণ্টন হবে';
  if (ph === 'roundOver') return esc(S.roundMsg || '') + ' (৫ সেকেন্ডে পরের রাউন্ড)';
  return '';
}

function seatHTML(rel){
  const i = (mySeat + rel) % 4;
  const cls = ['seat', 's'+rel];
  if (S.phase === 'playing' && S.turn === i) cls.push('turn');
  if (S.lastWinner === i && cnt(S.table) === 4) cls.push('win');
  const dbl = S.doubles && S.doubles[i] === 1 ? ' <span class="dbl">ডাবল</span>' : '';
  const taken = (S.seatPts && S.seatPts[i]) || 0;
  return `<div class="${cls.join(' ')}"><b>${esc(nameOf(i))}</b> ${isBot(i)?'🤖':''}
    <div class="small">${bidText(i)}${i===S.highBidder && S.phase!=='lobby' && S.phase!=='bidding' ? ' · বিডার' : ''}${dbl}</div>
    <div class="small">পয়েন্ট: ${taken}</div>
    ${formHTML(i)}
    <div class="coins">🪙 ${coinsOf(i)}</div></div>`;
}

function centerHTML(){
  const ph = S.phase;
  const trump = S.trump
    ? `<div class="trumpS" style="color:${isRed(S.trump)?'#ff7a7a':'#fff'}">${S.trump}</div><div class="small">তুরুপ</div>`
    : `<div class="small">তুরুপ: —</div>`;
  let info = '';
  if (ph === 'playing') info = `ট্রিক ${S.tricks||0}/৮ · ডাকা ${S.highBid}`;
  else if (ph === 'double') info = 'ডাবল পর্ব';
  else if (ph === 'bidding') info = S.highBid > 15 ? `সর্বোচ্চ ${S.highBid}` : 'বিডিং চলছে';
  else if (ph === 'lobby') info = `রুম ${esc(code)}`;
  const mult = (S.mult || 1) === 2 && (ph === 'playing' || ph === 'roundOver') ? ' · ×২' : '';
  const pot = `<div class="pot">পট: ${stakeOf(S)*4*(S.mult||1)} 🪙${mult}</div>`;
  return `<div class="center">${trump}<div class="small">${info}</div>${pot}</div>`;
}

function render(){
  if (!S) return;
  const isHost = S.host === uid;
  const ph = S.phase;
  const mt = mySeat % 2;
  const won = S.scores?.[mt] || 0;
  const lost = S.scores?.[1-mt] || 0;

  $('info').innerHTML = `
    <div class="score">
      <span>রুম <b>${esc(code)}</b> · বাজি ${stakeOf(S)} 🪙</span>
      <span>Win <span class="wl win">${won}</span> Lose <span class="wl lose">${lost}</span></span>
    </div>
    <div class="status">${statusText()}</div>
    ${ph==='playing'||ph==='roundOver' ? `<div class="small">এই রাউন্ড — আমাদের দল: ${S.teamPts?.[mt]||0} · বিপক্ষ: ${S.teamPts?.[1-mt]||0}</div>` : ''}`;

  const t = S.table || {};
  const tableCards = Object.entries(t).map(([k,c]) => {
    const rel = (+k - mySeat + 4) % 4;
    const p = PTS[c.r] ? `<span class="pts">${PTS[c.r]}</span>` : '';
    return `<div class="pc pc${rel} ${isRed(c.s)?'red':''}">${p}${c.r}<small>${c.s}</small></div>`;
  }).join('');

  $('table').innerHTML = `
    <div class="table">
      ${seatHTML(1)}${seatHTML(2)}${seatHTML(3)}
      ${centerHTML()}
      ${tableCards}
    </div>`;

  const hist = vals(S.history);
  $('history').innerHTML = hist.length
    ? `<div class="small">আগের রাউন্ড</div><div class="hist">${hist.map(x=>esc(x)).join('<br>')}</div>`
    : '';
  $('history').classList.toggle('hidden', !hist.length);

  let act = '';
  if (ph==='lobby' && isHost) act += `<button onclick="startGame()">খেলা শুরু</button>`;
  if (ph==='bidding' && S.bidTurn===mySeat) {
    for (let v=16; v<=28; v++) act += `<button ${v<=S.highBid?'disabled':''} onclick="bid(${v})">${v}</button>`;
    act += `<button onclick="bid(0)">পাস</button>`;
  }
  if (ph==='trump' && S.highBidder===mySeat) {
    act += SUITS.map(s => `<button onclick="chooseTrump('${s}')">${s}</button>`).join('');
  }
  if (ph==='double' && mySeat % 2 !== S.highBidder % 2 && !(S.doubles && S.doubles[mySeat] !== undefined)) {
    act += `<button onclick="doubleMe(true)">ডাবল (×২)</button><button onclick="doubleMe(false)">নরমাল</button>`;
  }
  if ((ph==='redeal' || ph==='roundOver') && isHost) act += `<button onclick="nextRound()">পরের রাউন্ড এখনই</button>`;
  $('actions').innerHTML = act;
  $('actions').classList.toggle('hidden', !act);

  viewHand = hand.slice().sort((a,b) => SUITS.indexOf(a.s)-SUITS.indexOf(b.s) || RANKS.indexOf(a.r)-RANKS.indexOf(b.r));
  const canPlay = ph==='playing' && S.turn===mySeat;
  $('hand').innerHTML = `<div class="box">
    <div class="small">আপনার তাস (${hand.length})${S.trump?' · তুরুপ '+S.trump:''}
      <button onclick="showCards=!showCards;render()" style="padding:3px 8px;font-size:12px;margin-left:6px">${showCards?'তাস লুকান':'তাস দেখুন'}</button></div>
    <div class="hand">${viewHand.map((c,i) => {
      const ok = canPlay && legalIn(c, hand, S.table, S.leadSuit);
      if (!showCards) return `<button class="card back" ${ok?'':'disabled'} onclick="playIdx(${i})">🂠</button>`;
      return `<button class="card ${isRed(c.s)?'red':''} ${ok?'ok':''}" ${ok?'':'disabled'} onclick="playIdx(${i})">
        ${PTS[c.r] ? `<span class="pts">${PTS[c.r]}</span>` : ''}${c.r}<small>${c.s}</small></button>`;
    }).join('')}</div></div>`;
}
</script>
